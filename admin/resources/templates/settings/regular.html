<!DOCTYPE html>
<html
    xmlns:th="http://www.thymeleaf.org"
    xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{ezyadmin}">

<body>
<div layout:fragment="content" class="row">
    <div class="col-lg-10">
        <form id="editRegularSettingsForm" onsubmit="return false;">
            <div class="form-group row">
                <label for="defaultAdminLanguage" class="col-md-4 col-form-label">
                    [[#{default_admin_language}]]
                </label>
                <div class="col-md-2 d-flex align-items-center">
                    <select class="form-select form-control" name="defaultAdminLanguage" id="defaultAdminLanguage">
                        <option value="">[[#{default}]]</option>
                        <option th:each="adminLanguage : ${adminLanguages}"
                                th:value="${adminLanguage.code}"
                                th:selected="${adminLanguage.code == adminDefaultLanguageCode}">
                            [[${adminLanguage.name}]]
                        </option>
                    </select>
                </div>
                <div class="col-md-6"></div>
            </div>
            <div class="form-group row">
                <label for="allowSendStatisticsData" class="col-md-4 col-form-label">
                    [[#{allow_send_statistics_data}]]
                </label>
                <div class="col-md-8 d-flex align-items-center">
                    <input type="checkbox" name="allowSendStatisticsData" id="allowSendStatisticsData" class="form-check wh-1rem"
                           th:value="${regularSettings.allowSendStatisticsData}"
                           th:checked="${regularSettings.allowSendStatisticsData}">
                </div>
            </div>
            <div class="form-group row">
                <label for="newPlatformMailScheduleType" class="col-md-4 col-form-label">
                    [[#{new_platform_mail_schedule_type}]]
                </label>
                <div class="col-md-2 d-flex align-items-center">
                    <select class="form-select form-control" name="newPlatformMailScheduleType" id="newPlatformMailScheduleType"
                            th:value="${newPlatformMailScheduleType.toString()}">
                        <option value="DAYS" th:selected="${newPlatformMailScheduleType.toString() == 'DAYS'}">
                            1 [[#{day}]]
                        </option>
                        <option value="WEEKS" th:selected="${newPlatformMailScheduleType.toString() == 'WEEKS'}">
                            1 [[#{week}]]
                        </option>
                        <option value="MONTHS" th:selected="${newPlatformMailScheduleType.toString() == 'MONTHS'}">
                            1 [[#{month}]]
                        </option>
                        <option value="NEVER" th:selected="${newPlatformMailScheduleType.toString() == 'NEVER'}">
                            [[#{never}]]
                        </option>
                    </select>
                </div>
                <div class="col-md-6"></div>
            </div>
            <div class="form-group row">
                <label for="paginationCountLimit" class="col-md-4 col-form-label">
                    [[#{maximum_number_of_records_counted_in_a_pagination_query}]]
                </label>
                <div class="col-md-4">
                    <input type="text" name="paginationCountLimit" id="paginationCountLimit"
                           class="form-control" th:placeholder="#{maximum_number_of_records_counted_in_a_pagination_query}"
                           onkeydown="ezyadmin.onKeyDownToEditRegularSettings();"
                           th:value="${paginationCountLimit}">
                </div>
                <label id="paginationCountLimitErrorLabel" class="col-md-4 col-form-label text-danger d-none" for="paginationCountLimit">
                    <i class="far fa-times-circle"></i> <span id="paginationCountLimitError">[[#{invalid}]]</span>
                </label>
            </div>
            <div class="form-group row">
                <label for="adminAutoPassManagementUris" class="col-md-4 col-form-label">
                    [[#{auto_pass_management_uris}]]
                </label>
                <div class="col-md-5">
                    <textarea name="adminAutoPassManagementUris" id="adminAutoPassManagementUris"
                              class="form-control" rows="4"
                              th:placeholder="#{auto_pass_management_uris}">[[${#strings.setJoin(adminAutoPassManagementUris, ',')}]]</textarea>
                </div>
                <label id="adminAutoPassManagementUrisErrorLabel" class="col-md-3 col-form-label text-danger d-none" for="adminAutoPassManagementUris">
                    <i class="far fa-times-circle"></i> <span id="adminAutoPassManagementUrisError">[[#{invalid}]]</span>
                </label>
            </div>
            <div class="form-group row">
                <label for="allowSearchAdminByLikeOperator" class="col-md-4 col-form-label">
                    [[#{allow_search_admin_by_like_operator}]]
                </label>
                <div class="col-md-8 d-flex align-items-center">
                    <input type="checkbox" name="allowSearchAdminByLikeOperator" id="allowSearchAdminByLikeOperator" class="form-check wh-1rem"
                           th:value="${allowSearchAdminByLikeOperator}"
                           th:checked="${allowSearchAdminByLikeOperator}">
                </div>
            </div>
            <div class="form-group row">
                <label for="allowSearchUserByLikeOperator" class="col-md-4 col-form-label">
                    [[#{allow_search_user_by_like_operator}]]
                </label>
                <div class="col-md-8 d-flex align-items-center">
                    <input type="checkbox" name="allowSearchUserByLikeOperator" id="allowSearchUserByLikeOperator" class="form-check wh-1rem"
                           th:value="${allowSearchUserByLikeOperator}"
                           th:checked="${allowSearchUserByLikeOperator}">
                </div>
            </div>
            <div class="form-group row">
                <label for="allowSearchMediaByLikeOperator" class="col-md-4 col-form-label">
                    [[#{allow_search_media_by_like_operator}]]
                </label>
                <div class="col-md-8 d-flex align-items-center">
                    <input type="checkbox" name="allowSearchMediaByLikeOperator" id="allowSearchMediaByLikeOperator" class="form-check wh-1rem"
                           th:value="${allowSearchMediaByLikeOperator}"
                           th:checked="${allowSearchMediaByLikeOperator}">
                </div>
            </div>
            <div class="form-group row">
                <label for="maxUploadFileSize" class="col-md-4 col-form-label">
                    [[#{max_upload_file_size}]]
                </label>
                <div class="col-md-4">
                    <input type="text" name="maxUploadFileSize" id="maxUploadFileSize"
                           class="form-control" th:placeholder="#{max_upload_file_size}"
                           onkeydown="ezyadmin.onKeyDownToEditRegularSettings();"
                           th:value="${maxUploadFileSizeText}">
                </div>
                <label id="maxUploadFileSizeErrorLabel" class="col-md-4 col-form-label text-danger d-none" for="maxUploadFileSize">
                    <i class="far fa-times-circle"></i> <span id="maxUploadFileSizeError">[[#{invalid}]]</span>
                </label>
            </div>
            <div class="form-group row">
                <label for="maxUploadImageFileSize" class="col-md-4 col-form-label">
                    [[#{max_upload_image_file_size}]]
                </label>
                <div class="col-md-4">
                    <input type="text" name="maxUploadImageFileSize" id="maxUploadImageFileSize"
                           class="form-control" th:placeholder="#{max_upload_image_file_size}"
                           onkeydown="ezyadmin.onKeyDownToEditRegularSettings();"
                           th:value="${maxUploadImageFileSizeText}">
                </div>
                <label id="maxUploadImageFileSizeErrorLabel" class="col-md-4 col-form-label text-danger d-none" for="maxUploadImageFileSize">
                    <i class="far fa-times-circle"></i> <span id="maxUploadImageFileSizeError">[[#{invalid}]]</span>
                </label>
            </div>
            <div class="form-group row">
                <label for="maxReducedImageFileSize" class="col-md-4 col-form-label">
                    [[#{max_reduced_image_file_size}]]
                </label>
                <div class="col-md-4">
                    <input type="text" name="maxReducedImageFileSize" id="maxReducedImageFileSize"
                           class="form-control" th:placeholder="#{max_reduced_image_file_size}"
                           onkeydown="ezyadmin.onKeyDownToEditRegularSettings();"
                           th:value="${maxReducedImageFileSizeText}">
                </div>
                <label id="maxReducedImageFileSizeErrorLabel" class="col-md-4 col-form-label text-danger d-none" for="maxReducedImageFileSize">
                    <i class="far fa-times-circle"></i> <span id="maxReducedImageFileSizeError">[[#{invalid}]]</span>
                </label>
            </div>
            <div class="form-group row">
                <label for="allowReduceMediaFileSize" class="col-md-4 col-form-label">
                    [[#{allow_media_file_size_reduction}]]
                </label>
                <div class="col-md-8 d-flex align-items-center">
                    <input type="checkbox" name="allowReduceMediaFileSize" id="allowReduceMediaFileSize" class="form-check wh-1rem"
                           th:checked="${allowReduceMediaFileSize}">
                </div>
            </div>
            <div class="form-group row">
                <label for="keepOriginalSizeImageFile" class="col-md-4 col-form-label">
                    [[#{keep_original_size_image_file}]]
                </label>
                <div class="col-md-8 d-flex align-items-center">
                    <input type="checkbox" name="keepOriginalSizeImageFile" id="keepOriginalSizeImageFile" class="form-check wh-1rem"
                           th:checked="${keepOriginalSizeImageFile}">
                </div>
            </div>
            <div class="form-group row">
                <label for="allowKeepingReplacedMedia" class="col-md-4 col-form-label">
                    [[#{allow_keeping_replaced_media}]]
                </label>
                <div class="col-md-8 d-flex align-items-center">
                    <input type="checkbox" name="allowKeepingReplacedMedia" id="allowKeepingReplacedMedia" class="form-check wh-1rem"
                           th:checked="${allowKeepingReplacedMedia}">
                </div>
            </div>
            <div class="form-group row">
                <label for="allowPermanentlyDeleteMedia" class="col-md-4 col-form-label">
                    [[#{allow_permanently_delete_media}]]
                </label>
                <div class="col-md-8 d-flex align-items-center">
                    <input type="checkbox" name="allowPermanentlyDeleteMedia" id="allowPermanentlyDeleteMedia" class="form-check wh-1rem"
                           th:checked="${allowPermanentlyDeleteMedia}">
                </div>
            </div>
            <div class="form-group row">
                <label for="acceptedMediaMimeTypes" class="col-md-4 col-form-label">
                    [[#{accepted_media_types}]]
                </label>
                <div class="col-md-5">
                    <textarea name="acceptedMediaMimeTypes" id="acceptedMediaMimeTypes"
                              class="form-control" rows="4"
                              th:placeholder="#{accepted_media_types}">[[${#strings.setJoin(acceptedMediaMimeTypes, ',')}]]</textarea>
                </div>
                <label id="acceptedMediaMimeTypesErrorLabel" class="col-md-3 col-form-label text-danger d-none" for="acceptedMediaMimeTypes">
                    <i class="far fa-times-circle"></i> <span id="acceptedMediaMimeTypesError">[[#{invalid}]]</span>
                </label>
            </div>
            <div class="form-group row">
                <label for="numberOfMediaPerPage" class="col-md-4 col-form-label">
                    [[#{number_of_media_per_page}]]
                </label>
                <div class="col-md-4">
                    <input type="text" name="numberOfMediaPerPage" id="numberOfMediaPerPage"
                           class="form-control" th:placeholder="#{number_of_media_per_page}"
                           onkeydown="ezyadmin.onKeyDownToEditRegularSettings();"
                           th:value="${numberOfMediaPerPage}">
                </div>
                <label id="numberOfMediaPerPageErrorLabel" class="col-md-4 col-form-label text-danger d-none" for="numberOfMediaPerPage">
                    <i class="far fa-times-circle"></i> <span id="numberOfMediaPerPageError">[[#{invalid}]]</span>
                </label>
            </div>
            <div class="row">
                <div class="col-md-4"></div>
                <div class="col-md-2 mb-2">
                    <button th:if="${adminRoles.isAccessible('/api/v1/settings/regular', 'PUT')}"
                            type="button" class="btn btn-primary btn-block" onclick="ezyadmin.editRegularSettings();">
                        [[#{save}]]
                    </button>
                </div>
                <div class="col-md-6"></div>
                <!-- /.col -->
            </div>
        </form>
    </div>
    <div class="col-lg-2"></div>
    <div class="col-12">
        <hr class="mb-4" />
    </div>
    <div class="col-12">
        <h3>[[#{admin_login}]]</h3>
    </div>
    <div class="col-lg-10 mt-3">
        <form id="editAdminLoginSettingsForm" onsubmit="return false;">
            <div class="form-group row">
                <label for="maxLoginFailures" class="col-md-4 col-form-label">
                    [[#{max_login_failures}]]
                </label>
                <div class="col-lg-6 col-md-4">
                    <input type="text" name="maxLoginFailures" id="maxLoginFailures"
                           class="form-control" th:placeholder="#{max_login_failures}"
                           onkeydown="ezyadmin.onKeyDownToEditAdminLoginSettings();"
                           th:value="${adminLoginSettings.maxLoginFailures}">
                </div>
                <label id="maxLoginFailuresErrorLabel" class="col-lg-2 col-md-4 col-form-label text-danger d-none" for="maxLoginFailures">
                    <i class="far fa-times-circle"></i> <span id="maxLoginFailuresError">[[#{invalid}]]</span>
                </label>
            </div>
            <div class="form-group row">
                <label for="loginFailureBlockDuration" class="col-md-4 col-form-label">
                    [[#{login_failure_block_duration}]]
                </label>
                <div class="col-lg-6 col-md-4">
                    <input type="text" name="loginFailureBlockDuration" id="loginFailureBlockDuration"
                           class="form-control" th:placeholder="#{duration_in_minutes}"
                           onkeydown="ezyadmin.onKeyDownToEditAdminLoginSettings();"
                           th:value="${adminLoginSettings.loginFailureBlockDuration}">
                </div>
                <label id="loginFailureBlockDurationErrorLabel" class="col-lg-2 col-md-4 col-form-label text-danger d-none" for="loginFailureBlockDuration">
                    <i class="far fa-times-circle"></i> <span id="loginFailureBlockDurationError">[[#{invalid}]]</span>
                </label>
            </div>
            <div class="row">
                <div class="col-md-4"></div>
                <div class="col-md-2 mb-2">
                    <button th:if="${adminRoles.isAccessible('/api/v1/settings/admin-login', 'PUT')}"
                            type="button" class="btn btn-primary btn-block" onclick="ezyadmin.editAdminLoginSettings();">
                        [[#{save}]]
                    </button>
                </div>
                <div class="col-md-6"></div>
                <!-- /.col -->
            </div>
        </form>
    </div>
    <div class="col-lg-2"></div>
    <div class="col-12">
        <hr class="mb-4" />
    </div>
    <div class="col-12">
        <h3>[[#{admin_access_token}]]</h3>
    </div>
    <div class="col-lg-10 mt-3">
        <form id="changeEncryptionKeyForm" onsubmit="return false;">
            <div class="form-group row">
                <label for="adminTokenExpiredTimeInDay" class="col-md-4 col-form-label">
                    [[#{token_expiration_time}]]
                </label>
                <div class="col-md-4">
                    <div class="d-flex align-items-center gap-2">
                        <input type="text" name="tokenExpiredTimeInDay" id="adminTokenExpiredTimeInDay"
                               class="form-control" th:placeholder="#{token_expiration_time}"
                               oninput="ezyadmin.onKeyDownToEditAdminTokenExpirationTimeSetting(this);"
                               th:value="${adminTokenExpiredTimeInDay}">
                        <span class="text-nowrap">[[#{day_s}]]</span>
                    </div>
                </div>
                <label id="adminTokenExpiredTimeInDayErrorLabel" class="col-md-4 col-form-label text-danger d-none" for="adminTokenExpiredTimeInDay">
                    <i class="far fa-times-circle"></i> <span id="adminTokenExpiredTimeInDayError">[[#{invalid}]]</span>
                </label>
            </div>
            <div class="form-group row">
                <label for="adminAccessTokenHttpOnly" class="col-md-4 col-form-label">
                    [[#{http_only}]]
                </label>
                <div class="col-md-8 d-flex align-items-center">
                    <input type="checkbox" name="adminAccessTokenHttpOnly" id="adminAccessTokenHttpOnly" class="form-check wh-1rem"
                           th:value="${adminAccessTokenHttpOnly}"
                           th:checked="${adminAccessTokenHttpOnly}"
                           onchange="ezyadmin.changeAdminAccessTokenHttpOnly(this);">
                </div>
            </div>
            <div class="form-group row">
                <label for="currentEncryptionKey" class="col-md-4 col-form-label">
                    [[#{current_encryption_key}]]
                </label>
                <div class="col-md-6 d-flex">
                    <input type="text" name="currentEncryptionKey" id="currentEncryptionKey" class="form-control"
                           value="************" disabled>
                    <button type="button" class="btn btn-info ml-1 white-space-nowrap"
                            id="showEncryptionKeyButton"
                            onclick="ezyadmin.showEncryptionKey();">
                        [[#{show}]]
                    </button>
                    <button type="button" class="btn btn-secondary ml-1 white-space-nowrap d-none"
                            id="hideEncryptionKeyButton"
                            onclick="ezyadmin.hideEncryptionKey();">
                        [[#{hide}]]
                    </button>
                    <button type="button" class="btn btn-primary ml-1 white-space-nowrap"
                            id="changeEncryptionKeyButton"
                            onclick="ezyadmin.showChangeEncryptionKeyComponents();">
                        [[#{change}]]
                    </button>
                </div>
                <div class="col-md-2 d-flex"></div>
            </div>
            <div class="d-none" id="changeEncryptionKeyComponents">
                <div class="form-group row">
                    <label for="newEncryptionKey" class="col-md-4 col-form-label">
                        [[#{new_encryption_key}]] (<span class="text-danger">*</span>)</label>
                    <div class="col-md-6">
                        <input type="text" name="newEncryptionKey" id="newEncryptionKey"
                               class="form-control" th:placeholder="#{new_encryption_key}">
                    </div>
                    <label id="newEncryptionKeyErrorLabel" class="col-md-2 col-form-label text-danger d-none" for="newEncryptionKey">
                        <i class="far fa-times-circle"></i> <span id="newEncryptionKeyError">[[#{invalid}]]</span>
                    </label>
                </div>
                <div class="form-group row">
                    <label class="col-md-4 col-form-label">
                    </label>
                    <div class="col-md-6">
                        <div class="d-flex align-items-center">
                            <button type="button" id="randomEncryptionKeyButton" class="btn btn-outline-primary pt-1 pb-1"
                                    onclick="ezyadmin.onRandomEncryptionKeyClick();">
                                [[#{random}]]
                            </button>
                            <span class="ml-2" id="randomEncryptionKey"></span>
                        </div>
                    </div>
                    <div class="col-lg-2"></div>
                </div>
                <div class="row">
                    <div class="col-md-4"></div>
                    <div class="col-md-8">
                        <button type="button" class="btn btn-primary pl-4 pr-4" onclick="ezyadmin.changeEncryptionKey();">
                            [[#{submit}]]
                        </button>
                        <button type="button" class="btn btn-secondary pl-4 pr-4" onclick="ezyadmin.cancelChangeEncryptionKey();">
                            [[#{cancel}]]
                        </button>
                    </div>
                    <!-- /.col -->
                </div>
            </div>
            <div class="form-group row">
                <label for="adminSsoAllowedOrigins" class="col-md-4 col-form-label">
                    [[#{domains_allowed_to_share_access_token}]]
                </label>
                <div class="col-md-6">
                    <textarea name="tokenExpiredTimeInDay" id="adminSsoAllowedOrigins" rows="5"
                              class="form-control" th:placeholder="#{domains_allowed_to_share_access_token}"
                              th:value="${adminSsoAllowedOrigins}">[[${adminSsoAllowedOriginsText}]]</textarea>
                    <span>[[#{domains_allowed_to_share_access_token_guide}]]</span>
                </div>
                <label id="adminSsoAllowedOriginsErrorLabel" class="col-md-2 col-form-label text-danger d-none" for="adminSsoAllowedOrigins">
                    <i class="far fa-times-circle"></i> <span id="adminSsoAllowedOriginsError">[[#{invalid}]]</span>
                </label>
            </div>
            <div class="row">
                <div class="col-md-4"></div>
                <div class="col-md-2">
                    <button th:if="${adminRoles.isAccessible('/api/v1/settings/admin-sso-allowed-origins', 'PUT')}"
                            type="button" class="btn btn-primary btn-block" onclick="ezyadmin.saveAdminSsoAllowOriginsSettings();">
                        [[#{save}]]
                    </button>
                </div>
                <div class="col-md-6"></div>
            </div>
        </form>
    </div>
    <div class="col-lg-2"></div>
    <div class="col-12">
        <hr class="mb-4" />
    </div>
    <div class="col-12">
        <h3>[[#{datetime_format}]]</h3>
    </div>
    <div class="col-md-10">
        <form id="dateTimeFormatSettingsForm" onsubmit="return false;">
            <div class="form-group row">
                <label for="dateFormat" class="col-md-4 col-form-label">[[#{date_format}]]</label>
                <div class="col-md-6">
                    <input type="text" name="dateFormat" id="dateFormat"
                           class="form-control" th:placeholder="#{date_format}"
                           onkeydown="ezyadmin.onKeyDownToSaveDateTimeFormatSettings();"
                           th:value="${dateFormat}">
                </div>
                <label id="dateFormatErrorLabel" class="col-md-2 col-form-label text-danger d-none" for="dateFormat">
                    <i class="far fa-times-circle"></i> <span id="dateFormatError">[[#{invalid}]]</span>
                </label>
            </div>
            <div class="form-group row">
                <label for="timeFormat" class="col-md-4 col-form-label">[[#{time_format}]]</label>
                <div class="col-md-6">
                    <input type="text" name="timeFormat" id="timeFormat"
                           class="form-control" th:placeholder="#{time_format}"
                           onkeydown="ezyadmin.onKeyDownToSaveDateTimeFormatSettings();"
                           th:value="${timeFormat}">
                </div>
                <label id="timeFormatErrorLabel" class="col-md-2 col-form-label text-danger d-none" for="timeFormat">
                    <i class="far fa-times-circle"></i> <span id="timeFormatError">[[#{invalid}]]</span>
                </label>
            </div>
            <div class="form-group row">
                <label for="dateTimeFormat" class="col-md-4 col-form-label">[[#{datetime_format}]]</label>
                <div class="col-md-6">
                    <input type="text" name="dateTimeFormat" id="dateTimeFormat"
                           class="form-control" th:placeholder="#{datetime_format}"
                           onkeydown="ezyadmin.onKeyDownToSaveDateTimeFormatSettings();"
                           th:value="${dateTimeFormat}">
                </div>
                <label id="dateTimeFormatErrorLabel" class="col-md-2 col-form-label text-danger d-none" for="dateTimeFormat">
                    <i class="far fa-times-circle"></i> <span id="dateTimeFormatError">[[#{invalid}]]</span>
                </label>
            </div>
            <div class="form-group row">
                <label for="dateMinuteFormat" class="col-md-4 col-form-label">[[#{date_minute_format}]]</label>
                <div class="col-md-6">
                    <input type="text" name="dateMinuteFormat" id="dateMinuteFormat"
                           class="form-control" th:placeholder="#{date_minute_format}"
                           onkeydown="ezyadmin.onKeyDownToSaveDateTimeFormatSettings();"
                           th:value="${dateMinuteFormat}">
                </div>
                <label id="dateMinuteFormatErrorLabel" class="col-md-2 col-form-label text-danger d-none" for="dateMinuteFormat">
                    <i class="far fa-times-circle"></i> <span id="dateMinuteFormatError">[[#{invalid}]]</span>
                </label>
            </div>
            <div class="row">
                <div class="col-md-4"></div>
                <div class="col-md-2">
                    <button th:if="${adminRoles.isAccessible('/api/v1/settings/website', 'PUT')}"
                            type="button" class="btn btn-primary btn-block" onclick="ezyadmin.saveDateTimeFormatSettings();">
                        [[#{save}]]
                    </button>
                </div>
                <div class="col-md-6"></div>
                <!-- /.col -->
            </div>
        </form>
    </div>
    <div class="col-lg-2"></div>
    <th:block th:if="${adminRoles.isAccessible('/api/v1/setup-properties/fetch', 'POST')}">
        <div class="col-12">
            <hr>
        </div>
        <div class="col-lg-10">
            <div class="row">
                <div class="col-12">
                    <h3>[[#{setup_information}]]</h3>
                </div>
                <div class="col-md-4"><label>[[#{properties}]]:</label></div>
                <div class="col-md-8">
                    <div class="d-flex flex-column gap-2">
                        <textarea class="form-control d-none" rows="8"
                                  id="setupPropertiesTextArea"></textarea>
                        <div class="d-flex align-items-center gap-2">
                            <button type="button" class="btn btn-primary setup-properties-show-button"
                                    onclick="ezyadmin.onShowSetupPropertiesClick();">
                                [[#{show}]]
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-lg-2"></div>
    </th:block>
    <div class="col-12">
        <hr class="mb-4" />
    </div>
    <div class="col-lg-10">
        <div class="row">
            <div class="col-md-4 col-8">
                <h3>[[#{data_appenders}]]</h3>
            </div>
            <div class="col-md-8 col-4">
                <button type="button" class="btn btn-secondary"
                        onclick="ezyadmin.toggleShowHideDataAppenders(this);">
                    [[#{${allowReloadDataAppender ? 'hide' : 'show'}}]]
                </button>
            </div>
        </div>
    </div>
    <div class="col-lg-2"></div>
    <div class="col-12 mt-2 mb-3">
        [[#{reload_data_appenders_warning}]]
    </div>
    <div class="col-lg-10">
        <div class="mt-3" id="dataAppendersWrapper"
             th:classappend="${allowReloadDataAppender ? '' : 'd-none'}">
        </div>
    </div>
    <div class="col-lg-2"></div>
</div>
<th:block layout:fragment="modals">
    <th:block th:replace="~{modals/enter-password :: content}" />
    <th:block th:replace="~{fragments/data-appender :: modals}" />
</th:block>
<script layout:fragment="scripts" th:inline="javascript">
/*<![CDATA[*/
ezyadmin.allowReloadDataAppender = /*[[${allowReloadDataAppender}]]*/;
ezyadmin.messages.hide = /*[[#{hide}]]*/;
ezyadmin.messages.save_admin_login_settings_successfully = /*[[#{save_admin_login_settings_successfully}]]*/;
ezyadmin.messages.save_regular_settings_successfully = /*[[#{save_regular_settings_successfully}]]*/;
ezyadmin.messages.show = /*[[#{show}]]*/;
/*]]>*/
// =================== regular settings ================
ezyadmin.onKeyDownToEditRegularSettings = function() {
    if(event.key === 'Enter') {
    	ezyadmin.editRegularSettings();
    }
}

ezyadmin.editRegularSettings = function() {
    var formData = ezyadmin.formDataToObject('editRegularSettingsForm');
    formData.allowSearchUserByLikeOperator = $('#allowSearchUserByLikeOperator').prop('checked');
    formData.allowSearchMediaByLikeOperator = $('#allowSearchMediaByLikeOperator').prop('checked');
    formData.allowSearchAdminByLikeOperator = $('#allowSearchAdminByLikeOperator').prop('checked');
    formData.allowSendStatisticsData = $('#allowSendStatisticsData').prop('checked');
    formData.allowReduceMediaFileSize = $('#allowReduceMediaFileSize').prop('checked');
    formData.allowKeepingReplacedMedia = $('#allowKeepingReplacedMedia').prop('checked');
    formData.allowPermanentlyDeleteMedia = $('#allowPermanentlyDeleteMedia').prop('checked');
    formData.keepOriginalSizeImageFile = $('#keepOriginalSizeImageFile').prop('checked');
    $.ajax({
        type: 'PUT',
        url: '/api/v1/settings/regular',
        data: JSON.stringify(formData),
        contentType: 'application/json',
        success: function () {
            ezyadmin.hideFormErrors(formData);
            ezyadmin.shortToast(
                'bg-success',
                ezyadmin.messages.save_regular_settings_successfully
            );
        },
        error: function (data, e) {
            ezyadmin.processUpdateApiErrors(formData, data);
        }
    });
}

// =================== admin login settings ================
ezyadmin.onKeyDownToEditAdminLoginSettings = function() {
    if(event.key === 'Enter') {
    	ezyadmin.editAdminLoginSettings();
    }
}

ezyadmin.editAdminLoginSettings = function() {
    var formData = ezyadmin.formDataToObject('editAdminLoginSettingsForm');
    $.ajax({
        type: 'PUT',
        url: '/api/v1/settings/admin-login',
        data: JSON.stringify(formData),
        contentType: 'application/json',
        success: function () {
            ezyadmin.hideFormErrors(formData);
            ezyadmin.shortToast(
                'bg-success',
                ezyadmin.messages.save_admin_login_settings_successfully
            );
        },
        error: function (data, e) {
            ezyadmin.processUpdateApiErrors(formData, data);
        }
    });
}

// ========== access token =============
ezyadmin.onKeyDownToEditAdminTokenExpirationTimeSetting = function(e) {
    var value = $(e).val();
    $.ajax({
        type: 'PUT',
        url: '/api/v1/settings/admin-access-token-expiration-time',
        data: JSON.stringify({
            tokenExpiredTimeInDay: value
        }),
        contentType: 'application/json',
        success: function () {
            // do nothing
        },
        error: function (data, e) {
            ezyadmin.processUpdateApiErrors({}, data);
        }
    });
}

ezyadmin.changeAdminAccessTokenHttpOnly = function(e) {
    var value = $(e).prop('checked');
    $.ajax({
        type: 'PUT',
        url: '/api/v1/settings/admin-access-token-http-only',
        data: JSON.stringify({
            httpOnly: value
        }),
        contentType: 'application/json',
        success: function () {
            // do nothing
        },
        error: function (data, e) {
            ezyadmin.processUpdateApiErrors({}, data);
        }
    });
}

// ========== random key =============
ezyadmin.showChangeEncryptionKeyComponents = function() {
    $('#changeEncryptionKeyButton').addClass('d-none');
    $('#changeEncryptionKeyComponents').removeClass('d-none');
}

ezyadmin.onRandomEncryptionKeyClick = function() {
	$.ajax({
        type: 'POST',
        url: '/api/v1/settings/random-aes-key',
        success: function (data) {
            $('#newEncryptionKey').val(data.encryptionKey);
        },
        error: function (data, e) {
            ezyadmin.processUpdateApiErrors(formData, data);
        }
    });
}

ezyadmin.cancelChangeEncryptionKey = function() {
    $('#changeEncryptionKeyButton').removeClass('d-none');
    $('#changeEncryptionKeyComponents').addClass('d-none');
}

// ========== show/hide encryption key ===============
ezyadmin.showEncryptionKey = function() {
    $.ajax({
        url: '/api/v1/settings/admin-access-token-encryption-key',
        type: 'GET',
        dataType: 'json',
    })
    .done(function(data) {
		$('#currentEncryptionKey').val(data.encryptionKey);
		$('#showEncryptionKeyButton').addClass('d-none');
		$('#hideEncryptionKeyButton').removeClass('d-none');
    })
    .fail(function(e) {
    	ezyadmin.processGetApiErrors(e);
    });
}

ezyadmin.hideEncryptionKey = function() {
    $('#currentEncryptionKey').val('************');
    $('#showEncryptionKeyButton').removeClass('d-none');
    $('#hideEncryptionKeyButton').addClass('d-none');
}

// ========== change encryption key =============
ezyadmin.changeEncryptionKey = function() {
    var formData = {
        newEncryptionKey: $('#newEncryptionKey').val()
    };
    $.ajax({
        type: 'PUT',
        url: '/api/v1/settings/admin-access-token-encryption-key',
        data: JSON.stringify(formData),
        contentType: 'application/json',
        success: function () {
            location.reload();
        },
        error: function (data, e) {
            ezyadmin.processUpdateApiErrors(formData, data);
        }
    });
}

// ========== admin sso allow origins =============
ezyadmin.saveAdminSsoAllowOriginsSettings = function() {
    var adminSsoAllowedOrigins = $('#adminSsoAllowedOrigins').val();
    var strs = adminSsoAllowedOrigins.split('\n');
    var origins = {};
    strs.forEach((str) => {
        if (str.trim()) {
            var pair = str.split(':');
            origins[pair[0]] = pair.length > 1 ? pair[1] : pair[0];
        }
    });
    $.ajax({
        type: 'PUT',
        url: '/api/v1/settings/admin-sso-allowed-origins',
        data: JSON.stringify(origins),
        contentType: 'application/json',
        success: function () {
            ezyadmin.shortToast(
                'bg-success',
                ezyadmin.messages.save_successfully
            );
        },
        error: function (data, e) {
            ezyadmin.processUpdateApiErrors({}, data);
        }
    });
}

// ========== datetime format setting =============
ezyadmin.onKeyDownToSaveDateTimeFormatSettings = function() {
    if(event.key === 'Enter') {
    	ezyadmin.saveDateTimeFormatSettings();
    }
}
ezyadmin.saveDateTimeFormatSettings = function() {
    var formData = ezyadmin.formDataToObject('dateTimeFormatSettingsForm');
    $.ajax({
        type: 'PUT',
        url: '/api/v1/settings/admin-datetime-formats',
        data: JSON.stringify(formData),
        contentType: 'application/json',
        success: function () {
            ezyadmin.shortToast(
                'bg-success',
                ezyadmin.messages.save_successfully
            );
            location.reload();
        },
        error: function (data, e) {
            ezyadmin.processUpdateApiErrors(formData, data);
        }
    });
}

// ========== show setup properties =============
ezyadmin.onShowSetupPropertiesClick = function() {
    ezyadmin.enterPasswordApi = {
        url: '/api/v1/setup-properties/fetch',
        method: 'POST',
        onSuccess: (data) => {
            $('#setupPropertiesTextArea')
                .text(data)
                .removeClass('d-none');
            $('.setup-properties-show-button').addClass('d-none');
        },
        showToast: false
    };
    ezyadmin.showEnterPasswordModal();
}

// ========== reload data appender =============
ezyadmin.toggleShowHideDataAppenders = function(e) {
    var allowReloadDataAppender = !ezyadmin.allowReloadDataAppender;
    var formData = {
        allowReloadDataAppender: allowReloadDataAppender
    };
    $.ajax({
        type: 'PUT',
        url: '/api/v1/settings/allow-reload-data-appender',
        data: JSON.stringify(formData),
        contentType: 'application/json',
        success: function () {
            ezyadmin.allowReloadDataAppender = allowReloadDataAppender;
            if (ezyadmin.allowReloadDataAppender) {
                $(e).text(ezyadmin.messages.hide);
                $('#dataAppendersWrapper').removeClass('d-none');
                ezyadmin.fetchDataAppenders();
            } else {
                $(e).text(ezyadmin.messages.show);
                $('#dataAppendersWrapper').addClass('d-none');
            }
        },
        error: function (data, e) {
            ezyadmin.processUpdateApiErrors(formData, data);
        }
    });
}

ezyadmin.fetchDataAppenders = function() {
    $.ajax({
        url: '/api/v1/settings/data-appenders',
        type: 'GET',
        dataType: 'json',
    })
    .done(function(data) {
        var html = ezyadmin.buildDataAppenderListHtml(data);
        $('#dataAppendersWrapper').html(html);
    })
    .fail(function(e) {
    	ezyadmin.processGetApiErrors(e);
    });
}

ezyadmin.buildDataAppenderListHtml = function(dataAppenders) {
    var html = '';
    dataAppenders.forEach((dataAppender, index) => {
        html += ezyadmin.buildDataAppenderListItemHtml(dataAppender, index);
    });
    return html;
}

ezyadmin.buildDataAppenderListItemHtml = function(dataAppender, index) {
    return `
        <div class="row mb-3">
            <div class="col-md-4 col-8">
                <span class="text-break">${index + 1}. ${dataAppender.name}</span>
            </div>
            <div class="col-md-8 col-4">
                ${!dataAppender.started ? `
                    <button type="button" class="btn btn-primary"
                        onclick="ezyadmin.onDataAppenderActionClick('${dataAppender.name}', 'start')">
                        ${ezyadmin.messages.start}
                    </button>
                ` : ''}
                ${dataAppender.started ? `
                    <button type="button" class="btn btn-danger"
                        onclick="ezyadmin.onDataAppenderActionClick('${dataAppender.name}', 'stop')">
                        ${ezyadmin.messages.stop}
                    </button>
                    <button type="button" class="btn btn-info"
                        onclick="ezyadmin.onDataAppenderActionClick('${dataAppender.name}', 'restart')">
                        ${ezyadmin.messages.restart}
                    </button>
                ` : ''}
                <button type="button" class="btn btn-warning"
                    onclick="ezyadmin.onDataAppenderActionClick('${dataAppender.name}', 'reload')">
                    ${ezyadmin.messages.reload}
                </button>
            </div>
        </div>
    `;
}

$(document).ready(() => {
    if (ezyadmin.allowReloadDataAppender) {
        ezyadmin.fetchDataAppenders();
    }
});
</script>
<th:block layout:fragment="post-scripts">
    <th:block th:replace="~{modals/enter-password :: scripts}" />
    <th:block th:replace="~{fragments/data-appender :: scripts}" />
</th:block>
</body>
</html>
