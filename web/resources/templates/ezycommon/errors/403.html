<!DOCTYPE html>
<html
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:th="http://www.thymeleaf.org"
    xmlns:ezy="http://www.ezyplatform.com/thymeleaf/layout"
    xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{ezytheme}">
<head>
    <th:block th:if="${pageFragments != null && pageFragments.get('permission_denied') != null && !#strings.isEmpty(pageFragments.get('permission_denied').additionalHead)}">
        <ezy:block ezy:utext="${pageFragments.get('permission_denied').additionalHead}" />
    </th:block>
</head>
<body>
<th:block layout:fragment="content">
    <th:block th:if="${pageFragments != null && pageFragments.get('permission_denied') != null && pageFragments.get('permission_denied').content != 'permission_denied'}">
        <ezy:block ezy:utext="${pageFragments.get('permission_denied').content}" />
    </th:block>
    <th:block th:if="${pageFragments == null || pageFragments.get('permission_denied') == null || pageFragments.get('permission_denied').content == 'permission_denied'}">
        <div>
            <div class="error-page-wrapper">
                <div class="row">
                    <div class="col-lg-12">
                        <div class="error-page">
                            <h2 class="headline text-warning"> 403</h2>
                            <div class="error-content">
                                <h3><i class="fas fa-exclamation-triangle text-warning"></i> [[#{permission_denied_title}]]</h3>
                                <p th:utext="#{permission_denied_content}"></p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </th:block>
</th:block>
<th:block layout:fragment="scripts">
    <th:block th:if="${pageFragments != null && pageFragments.get('permission_denied') != null && !#strings.isEmpty(pageFragments.get('permission_denied').additionalFoot)}">
        <ezy:block ezy:utext="${pageFragments.get('permission_denied').additionalFoot}" />
    </th:block>
</th:block>
</body>
</html>
